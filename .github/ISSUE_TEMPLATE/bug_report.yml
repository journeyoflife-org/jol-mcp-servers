name: Bug Report
description: Report a bug in an MCP server
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out the sections below.

  - type: dropdown
    id: server
    attributes:
      label: Affected Server
      options:
        - jol-git-server
        - jol-jira-server
        - jol-compliance-server
        - jol-docs-server
        - shared library
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behaviour
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / Commit
    validations:
      required: true
