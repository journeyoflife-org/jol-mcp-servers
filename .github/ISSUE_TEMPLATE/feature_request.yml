name: Feature Request
description: Request a new feature or enhancement
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the feature you would like to see.

  - type: dropdown
    id: server
    attributes:
      label: Target Server
      options:
        - jol-git-server
        - jol-jira-server
        - jol-compliance-server
        - jol-docs-server
        - shared library
        - new server
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered

  - type: textarea
    id: security
    attributes:
      label: Security Considerations
      description: Any security implications of this feature?
    validations:
      required: true
