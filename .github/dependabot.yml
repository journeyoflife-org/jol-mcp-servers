version: 2
# Cooldown: hold newly published versions for 7 days before proposing
# updates — supply-chain defence against malicious/defective releases.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "pip"
    directory: "/servers/jol_git_server"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "git-server"

  - package-ecosystem: "pip"
    directory: "/servers/jol_jira_server"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "jira-server"

  - package-ecosystem: "pip"
    directory: "/servers/jol_compliance_server"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "compliance-server"

  - package-ecosystem: "pip"
    directory: "/servers/jol_docs_server"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "docs-server"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
