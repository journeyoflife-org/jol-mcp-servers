name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server:
          - jol_git_server
          - jol_jira_server
          - jol_compliance_server
          - jol_docs_server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check shared/ servers/${{ matrix.server }}/

      - name: Type check (mypy)
        run: uv run mypy shared/ servers/${{ matrix.server }}/

      - name: Test
        run: uv run pytest shared/ servers/${{ matrix.server }}/tests/ -v --tb=short

  security-scan:
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Bandit scan
        run: uv run bandit -r shared/ servers/ -ll

      - name: pip-audit
        run: uv run pip-audit
