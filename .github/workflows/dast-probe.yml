name: DAST Probe

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"  # Weekly Monday 12:00 UTC

permissions:
  contents: read

jobs:
  zap-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3

      - name: Install dependencies
        run: uv sync --all-extras

      # Start one real MCP endpoint (jol-docs-server) on the streamable-http
      # transport — the probe target. Verified locally: GET / -> 404,
      # GET /mcp -> 406 (server up, no HTML surface to spider deeply).
      - name: Start probe target (jol-docs-server, streamable-http)
        run: |
          nohup uv run python -c '
          from servers.jol_docs_server.server import mcp
          mcp.settings.host = "127.0.0.1"
          mcp.settings.port = 8080
          mcp.run(transport="streamable-http")
          ' > mcp-probe.log 2>&1 &
          echo $! > mcp-probe.pid

          # Fail fast with diagnostics if the target never comes up.
          # Note: no `curl -f` — the endpoint answers 406 to plain GETs,
          # which is proof the server is up.
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8080/mcp; then
              echo "Probe target is up (attempt $i)."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Probe target failed to start within 30s"
              cat mcp-probe.log
              exit 1
            fi
            sleep 1
          done

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@66042c8e7e24680119199a017e5b0e8603bf4dae  # v0.12.0
        with:
          target: "http://localhost:8080/mcp"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -m 10 -T 60"
          # Findings are triaged in .zap/rules.tsv; skip auto-filing a
          # GitHub issue for tolerated WARNs (needs issues:write anyway).
          allow_issue_writing: false

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: zap-report
          path: report_html.html

      - name: Stop probe target
        if: always()
        run: kill "$(cat mcp-probe.pid)" 2>/dev/null || true
