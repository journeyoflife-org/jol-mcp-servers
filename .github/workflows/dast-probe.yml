name: DAST Probe

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"  # Weekly Monday 12:00 UTC

permissions:
  contents: read

jobs:
  zap-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-extras

      # Start one real MCP endpoint (jol-docs-server) on the streamable-http
      # transport — the probe target. Verified locally: GET / -> 404,
      # GET /mcp -> 406 (server up, no HTML surface to spider deeply).
      - name: Start probe target (jol-docs-server, streamable-http)
        run: |
          nohup uv run python -c '
          from servers.jol_docs_server.server import mcp
          mcp.settings.host = "127.0.0.1"
          mcp.settings.port = 8080
          mcp.run(transport="streamable-http")
          ' > mcp-probe.log 2>&1 &
          echo $! > mcp-probe.pid

          # Fail fast with diagnostics if the target never comes up.
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/mcp; then
              echo "Probe target is up (attempt $i)."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Probe target failed to start within 30s"
              cat mcp-probe.log
              exit 1
            fi
            sleep 1
          done

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:8080/mcp"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -m 10 -T 60"

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html

      - name: Stop probe target
        if: always()
        run: kill "$(cat mcp-probe.pid)" 2>/dev/null || true
