name: DAST Probe

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"  # Weekly Monday 12:00 UTC

permissions:
  contents: read

jobs:
  zap-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start MCP servers (staging)
        run: |
          echo "Starting staging MCP endpoints for DAST probe..."
          # Servers would be started via docker-compose or similar
          # docker compose -f docker-compose.staging.yml up -d
          sleep 10  # Wait for servers to be ready

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:8080"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -m 10 -T 60"

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
