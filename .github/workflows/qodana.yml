# Qodana Cloud — static analysis for SOC 2 / ISO 27001 / GDPR compliance
# Results are sent to Qodana Cloud and posted as GitHub Checks.
# Required secret: QODANA_TOKEN (set in repo Settings → Secrets and variables → Actions)

name: Qodana

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read
  security-events: write

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Qodana scan
        uses: JetBrains/qodana-action@4861e015da555e86a72b862892aba6c2b93e6891  # v2026.1.3
        with:
          pr-mode: ${{ github.event_name == 'pull_request' }}
          upload-result: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
