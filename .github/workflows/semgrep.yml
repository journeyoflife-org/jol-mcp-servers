name: Semgrep SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 10 * * 1"  # Weekly Monday 10:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Pinned rulesets only: `--config auto` requires Semgrep Registry
      # login and resolved inconsistently in CI (flaky findings, exit 1).
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/python \
            --error \
            --sarif \
            --output semgrep-results.sarif

      # SARIF ingestion needs GitHub Code Security (GHAS), declined for cost
      # ($10/committer/month); without it the upload fails with "Resource not
      # accessible by integration". Keep it non-fatal so the scan result itself
      # (--error above) still gates merges; the upload is informational only.
      - name: Upload SARIF to Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e60ea984bd3baa95954f2856bcf24f9eaba46637  # v3
        with:
          sarif_file: semgrep-results.sarif
