name: Semgrep SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 10 * * 1"  # Weekly Monday 10:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # Pinned rulesets only: `--config auto` requires Semgrep Registry
      # login and resolved inconsistently in CI (flaky findings, exit 1).
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/python \
            --error \
            --sarif \
            --output semgrep-results.sarif

      # SARIF ingestion needs GitHub Code Security enabled for the repo.
      # Until the entitlement is active the upload fails with
      # "Resource not accessible by integration"; keep it non-fatal so the
      # scan result itself still gates merges. Remove continue-on-error
      # once Code Security is enabled (tracked in PR description).
      - name: Upload SARIF to Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e60ea984bd3baa95954f2856bcf24f9eaba46637  # v3
        with:
          sarif_file: semgrep-results.sarif
