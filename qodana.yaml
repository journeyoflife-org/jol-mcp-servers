# Qodana Cloud configuration — jol-mcp-servers
# Project is identified via QODANA_TOKEN in CI, not by key here.
# See: https://www.jetbrains.com/help/qodana/yaml.html
version: "1.0"

include:
  - name: qodana-community
    paths:
      - .

profile:
  name: qodana.recommended

# Suppress inspections that produce false positives for Python 3.12 patterns
exclude:
  # @dataclass(frozen=True) auto-generates __init__ — Python 2-only check
  - name: PyClassHasNoInitInspection
  # re.Pattern (PEP 585) and modern union syntax not recognised by older checker
  - name: PyTypeHintsInspection
