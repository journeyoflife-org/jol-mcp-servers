# Qodana — jol-mcp-servers
# Focus: Python security (bandit via S-rules), unused imports, type safety
# MCP servers expose JSON-RPC endpoints — input validation and type safety are critical.
version: "1.0"

linter: jetbrains/qodana-python-community:2026.1

profile:
  name: qodana.recommended

bootstrap: |
  pip install --quiet ruff mypy bandit pip-audit pytest pytest-cov 2>/dev/null || true

include:
  - name: PyUnresolvedReferences
  - name: PyShadowingNames
  - name: PyUnusedLocal
  - name: PyPackageRequirements

exclude:
  - name: All
    paths:
      - .venv/
      - .git/
      - .qodana/
      - tests/
  # Suppress false positives for Python 3.12 patterns
  - name: PyClassHasNoInitInspection
  - name: PyTypeHintsInspection

# Any CRITICAL issue fails the build
failThreshold: 1
